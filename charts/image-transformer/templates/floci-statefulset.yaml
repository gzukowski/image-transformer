apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: floci
  labels:
    app.kubernetes.io/name: floci
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: floci
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: floci
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floci
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: floci
          image: {{ .Values.floci.image }}
          # Default storage mode is in-memory, so a bucket/queue created by
          # floci-bootstrap-job vanishes on every pod restart even though the
          # PVC below is mounted — force it to actually persist to that PVC.
          env:
            - name: FLOCI_STORAGE_MODE
              value: persistent
            - name: FLOCI_STORAGE_PERSISTENT_PATH
              value: /app/data
          ports:
            - name: edge
              containerPort: 4566
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.floci.storage }}
