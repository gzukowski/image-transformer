apiVersion: v1
kind: LimitRange
metadata:
  name: image-transformer-limits
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  limits:
    # The Jobs/CronJob containers and initContainers don't declare their own
    # resources — without these defaults, the ResourceQuota below would reject them
    # for not specifying requests/limits.
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 200m
        memory: 256Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 1Gi
