apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  labels:
    app.kubernetes.io/name: cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.backend.cleanupSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cleanup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: {{ .Values.backend.image }}
              imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
              envFrom:
                - configMapRef:
                    name: backend-config
              env:
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: POSTGRES_DB
                - name: DB_HOST
                  value: postgres
                - name: DB_PORT
                  value: "5432"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: floci-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: floci-credentials
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: floci-credentials
                      key: AWS_DEFAULT_REGION
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  until (echo > /dev/tcp/postgres/5432) 2>/dev/null; do
                    echo "Waiting for postgres..."
                    sleep 2
                  done
                  until (echo > /dev/tcp/floci/4566) 2>/dev/null; do
                    echo "Waiting for floci..."
                    sleep 2
                  done
                  cleanup
