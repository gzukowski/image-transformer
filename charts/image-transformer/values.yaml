postgres:
  image: postgres:16-alpine
  storage: 1Gi
  user: image-transformer
  database: image-transformer
  password: ""

backend:
  image: image-transformer-backend:local
  imagePullPolicy: IfNotPresent
  maxUploadSizeMb: 10
  cleanupSchedule: "*/3 * * * *"
  cleanupStaleMinutes: 5

processor:
  image: image-transformer-processor:local
  imagePullPolicy: IfNotPresent
  thumbnailMaxSize: 256

frontend:
  image: image-transformer-frontend:local
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  # Empty host matches any Host header (fine for local kind + curl/browser on localhost).
  host: ""

floci:
  image: floci/floci:latest
  storage: 5Gi
  # Floci doesn't require real AWS credentials or an account — these are dummy
  # values so the app's AWS SDK client behaves the same as it would against real AWS.
  accessKeyId: test
  secretAccessKey: test
  region: us-east-1
  bucketName: uploads
  queueName: image-processing
  awsCliImage: amazon/aws-cli:latest
